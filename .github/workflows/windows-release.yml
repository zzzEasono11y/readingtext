name: Windows release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/windows-release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Electron runtime
        run: npx --no-install install-electron --no
      - name: Unit tests
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: Build Windows portable
        run: npm run build
      - name: Verify portable application
        run: node scripts/smoke-portable.js
      - name: Publish version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $filename = "ReadingText-$version-Windows.exe"
          $artifact = Join-Path dist $filename
          if (-not (Test-Path -LiteralPath $artifact)) { throw "Missing release executable: $artifact" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; keeping its assets."; exit 0 }
          $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $filename" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8NoBOM
          gh release create $tag $artifact dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "拾页 $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
